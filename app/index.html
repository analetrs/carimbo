<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carimbo">
<meta name="theme-color" content="#020202">
<link rel="apple-touch-icon" href="icon.png">
<title>Carimbo · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CARIMBO · protótipo clicável do frequentador (tema Noite)
   Tokens, filtros, chapas D8, tickets, passaporte e carimbos vêm da
   carimbo-landing-v4.html e de experimentos/tinta-e-botoes.html.
   Nada aqui funciona de verdade: o estado é falso e fica na memória.
   ===================================================================== */
:root{
  --surface:#020202; --raised:#241c30; --sunken:#3a2f47;
  --papel:#f0ece2; --on-papel:#020202;
  --ink:#fbfbfb; --ink-muted:#b4aeb9; --hairline:#443f38; --border-control:#87877f;
  --focus:#cbec50; --carimbo-azul:#9db4ff;

  --tinta-rosa:#f06dc3; --tinta-laranja:#f29049; --tinta-lima:#a0d248; --tinta-ciano:#5db3da;
  --c-rosa:#f07ac0; --c-azul:#9db4ff; --c-verm:#ff8a80; --c-verde:#9fdc7d;   /* carimbo sobre Noite */
  --p-rosa:#d5308e; --p-azul:#080aa0; --p-verm:#a8322b; --p-verde:#2f6a1b;   /* carimbo sobre papel */

  --font-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-xl:"Archivo",var(--font-display);
  --font-mono:"DM Mono",ui-monospace,Menlo,monospace;

  --mola:cubic-bezier(.34,1.8,.5,1);
  --saida:cubic-bezier(.2,.8,.2,1);
  --tinta-opacidade:.92;

  --top:max(env(safe-area-inset-top),14px);
  --bot:max(env(safe-area-inset-bottom),10px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--surface);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

/* ---------- aparelho: tela cheia no iPhone, moldura de 390×844 no computador ---------- */
#device{position:fixed;inset:0;overflow:hidden;background:var(--surface);isolation:isolate}
/* grão removido em 08/11 (fica só na arte) */
.fake-status,.home-ind{display:none}
#roteiro{display:none}

@media (min-width:700px) and (min-height:700px){
  body{background:#0b0910;display:grid;place-items:center}
  #device{position:relative;inset:auto;width:390px;height:844px;border-radius:56px;
    box-shadow:0 0 0 11px #18131f,0 0 0 12px #3a2f47,0 50px 120px rgba(0,0,0,.7);
    --top:54px;--bot:26px}
  .fake-status{display:flex;position:absolute;z-index:96;top:0;left:0;right:0;height:50px;padding:16px 34px 0 46px;
    justify-content:space-between;align-items:center;font:600 16px/1 var(--font-display);pointer-events:none}
  .fake-status::after{content:"";position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
  .fake-status small{font:600 14px/1 var(--font-display);letter-spacing:.02em}
  .home-ind{display:block;position:absolute;z-index:96;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);pointer-events:none}
  #roteiro{display:block;position:fixed;left:max(24px,calc(50vw - 195px - 330px));top:50%;transform:translateY(-50%);width:270px;
    max-height:92vh;overflow:auto;color:var(--ink)}
}
@media (min-width:700px) and (max-width:1000px){#roteiro{display:none !important}}

/* ---------- telas ---------- */
#views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--top) + 14px) 16px calc(var(--bot) + 116px);background:var(--surface);scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.notab{padding-bottom:calc(var(--bot) + 28px)}
.view.night{padding-bottom:calc(var(--bot) + 184px)}
.view > *{position:relative;z-index:1}
.view > .glow{position:absolute;z-index:0;inset:0 0 auto 0;height:620px;pointer-events:none;
  background:radial-gradient(ellipse 340px 300px at var(--gx,85%) 120px,color-mix(in srgb,var(--glow,var(--tinta-rosa)) 26%,transparent),transparent)}
.vblobs{position:absolute !important;z-index:0 !important;inset:0 0 auto 0;height:700px;pointer-events:none;isolation:isolate;overflow:hidden}
.vblobs svg{position:absolute;aspect-ratio:1;mix-blend-mode:multiply;opacity:.55;overflow:visible}
.halftone{position:absolute !important;z-index:0 !important;inset:0 0 auto 0;height:520px;pointer-events:none;
  background:radial-gradient(var(--ht,var(--tinta-ciano)) 2.1px,transparent 2.6px) 0 0/15px 15px;
  -webkit-mask-image:radial-gradient(circle at var(--hx,85%) var(--hy,30%),#000 0,transparent 55%);mask-image:radial-gradient(circle at var(--hx,85%) var(--hy,30%),#000 0,transparent 55%);opacity:.7}

/* transições entre telas */
.view.in-push{animation:inPush .44s var(--saida) both;z-index:3}
.view.out-push{animation:outPush .44s var(--saida) both;z-index:2}
.view.in-pop{animation:inPop .44s var(--saida) both;z-index:2}
.view.out-pop{animation:outPop .44s var(--saida) both;z-index:3}
.view.in-fade{animation:inFade .32s ease both;z-index:3}
.view.out-fade{animation:outFade .32s ease both;z-index:2}
.view.in-up{animation:inUp .5s var(--saida) both;z-index:3}
.view.out-down{animation:outDown .44s var(--saida) both;z-index:3}
@keyframes inPush{from{transform:translateX(100%)}}
@keyframes outPush{to{transform:translateX(-28%);opacity:.3}}
@keyframes inPop{from{transform:translateX(-28%);opacity:.3}}
@keyframes outPop{to{transform:translateX(100%)}}
@keyframes inFade{from{opacity:0;transform:scale(.985)}}
@keyframes outFade{to{opacity:0}}
@keyframes inUp{from{transform:translateY(100%)}}
@keyframes outDown{to{transform:translateY(100%)}}

/* carimbo de entrada (landing v4) */
@keyframes carimbar{
  0%{opacity:0;transform:scale(1.4) rotate(calc(var(--r,0deg) - 5deg))}
  42%{opacity:1;transform:scale(.94) rotate(calc(var(--r,0deg) + 1deg))}
  68%{transform:scale(1.03) rotate(calc(var(--r,0deg) - .5deg))}
  100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}
}
@keyframes bater{
  0%{opacity:0;transform:scale(2) rotate(calc(var(--r,0deg) - 28deg))}
  55%{opacity:1;transform:scale(.9) rotate(calc(var(--r,0deg) + 3deg))}
  100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}
}
.st{animation:carimbar .62s cubic-bezier(.3,.9,.4,1) backwards;animation-delay:calc(var(--i,0) * 70ms + 120ms);transform-origin:0 60%}
.bate{animation:bater .5s cubic-bezier(.3,.9,.4,1) backwards;animation-delay:calc(var(--d,0) * 1ms)}

/* ---------- tipografia ---------- */
.eyebrow{font:500 12px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-lima);margin-bottom:10px}
.mono{font-family:var(--font-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
.h-xl{font:800 46px/46px var(--font-xl);letter-spacing:-.035em}
.h-disp{font:800 32px/34px var(--font-display);letter-spacing:-.02em}
.h-title{font:700 22px/26px var(--font-display);letter-spacing:-.01em}
.h-sub{font:600 17px/22px var(--font-body)}
.overprint{position:relative;isolation:isolate;display:inline-block}
/* sem aberração cromática no texto (08/11): a personalidade vem da fonte, depois */
.lead{font-size:17px;line-height:24px;color:var(--ink-muted)}
.sec{margin-top:30px}
.sec > .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.sec > .sh h2{font:700 20px/24px var(--font-display);letter-spacing:-.01em}
.sec > .sh span{font:500 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.stack > * + *{margin-top:12px}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- botão: uma chapa limpa, borda áspera, mola (08/11: sem 2ª tinta) ---------- */
.btn{--p1:var(--tinta-rosa);--rot:0deg;
  position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 24px;border-radius:999px;color:#fff;font:600 15px/20px var(--font-body);letter-spacing:-.01em;white-space:nowrap}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;filter:url(#aspero);
  background:var(--p1);transform:rotate(var(--rot));transition:transform 420ms var(--mola)}
.btn:active,.btn.pressed{--rot:1.6deg}
.btn.lc{--p1:var(--tinta-lima);color:#020202}
.btn.full{width:calc(100% - 4px);margin-left:2px}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.big{min-height:60px;font-size:17px}
.btn.ghost{color:var(--ink)}
.btn.ghost::before{background:var(--sunken);opacity:1;filter:none}
.btn.ghost.papel{color:#020202}
.btn.ghost.papel::before{background:rgba(2,2,2,.08)}
.btn[disabled],.btn.off{color:var(--ink-muted);pointer-events:none}
.btn[disabled]::before,.btn.off::before{background:var(--sunken);opacity:1}
.btn .b-pts{font:500 12px/1 var(--font-mono);letter-spacing:.06em;opacity:.9}
.link{font:500 14px/20px var(--font-body);color:var(--ink-muted);text-decoration:underline;text-underline-offset:3px;padding:10px 4px}

/* chapa simples (landing: tabs, chips, seg) */
.chip,.seg button,.backbtn{position:relative;isolation:isolate;border-radius:999px;padding:8px 14px;font:500 14px/18px var(--font-body);color:var(--ink);transition:color .2s}
.chip::before,.seg button::before,.backbtn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:999px;background:var(--sunken);transition:transform 420ms var(--mola)}
.chip:active::before,.seg button:active::before,.backbtn:active::before{transform:rotate(2deg)}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{color:#020202;font-weight:600}
.chip[aria-pressed="true"]::before,.seg button[aria-pressed="true"]::before{background:var(--tinta-ciano);filter:url(#aspero);transform:rotate(-1.2deg)}
.chip.lima[aria-pressed="true"]::before{background:var(--tinta-lima)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none}
.seg{display:inline-flex;gap:6px}
.backbtn{padding:8px 16px 8px 12px;font-weight:600}
.backbtn.on-poster{color:#020202}
.backbtn.on-poster::before{background:color-mix(in srgb,var(--papel) 88%,transparent)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;min-height:36px}

/* tag = carimbo de texto */
.tag{display:inline-block;position:relative;isolation:isolate;font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--carimbo-azul);padding:6px 9px;transform:rotate(var(--r,-2deg));white-space:nowrap}
.tag::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:4px;background:color-mix(in srgb,var(--carimbo-azul) 24%,var(--sunken));filter:url(#aspero)}
.tag.pat{color:#020202}.tag.pat::before{background:var(--papel)}
.tag.lima{color:#020202}.tag.lima::before{background:var(--tinta-lima)}
.tag.rosa{color:#020202}.tag.rosa::before{background:var(--tinta-rosa)}
.tag.lar{color:#020202}.tag.lar::before{background:var(--tinta-laranja)}
.tag.cin{color:var(--ink-muted)}.tag.cin::before{background:var(--sunken)}
.tag.verm{color:var(--c-verm)}.tag.verm::before{background:color-mix(in srgb,var(--c-verm) 22%,var(--sunken))}
.tag.onp{color:var(--p-azul)}.tag.onp::before{background:transparent;border:1.5px solid currentColor}

/* cartão */
.card{position:relative;isolation:isolate;padding:18px}
.card::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:24px;background:var(--raised)}
.card.sunk::before{background:var(--sunken)}
.card.rough::before{filter:url(#aspero-lg)}
.card.papel{color:var(--on-papel)}
.card.papel::before{background:var(--papel);border-radius:14px}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;z-index:40;left:10px;right:10px;bottom:calc(var(--bot) + 6px);height:64px;display:grid;grid-template-columns:1fr 1fr 82px 1fr 1fr;align-items:center;
  border-radius:999px;background:color-mix(in srgb,var(--raised) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  transition:transform .4s var(--saida),opacity .3s}
.tabbar.hide{transform:translateY(140%);opacity:0;pointer-events:none}
.tab{position:relative;isolation:isolate;height:40px;margin:0 3px;border-radius:999px;font:500 12px/1 var(--font-body);color:var(--ink-muted);letter-spacing:-.01em}
.tab::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:999px;transform:rotate(0);transition:transform 420ms var(--mola),background .2s}
.tab[aria-selected="true"]{color:#020202;font-weight:650}
.tab[aria-selected="true"]::before{background:var(--tinta-lima);filter:url(#aspero);transform:rotate(-1.6deg)}
.tab:active::before{transform:rotate(2deg)}
.tab-ck{--rot:0deg;position:relative;isolation:isolate;width:76px;height:76px;margin:-22px auto 0;border-radius:50%;color:#fff;font:800 14px/1 var(--font-display);letter-spacing:-.01em}
.tab-ck::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;filter:url(#aspero-lg);
  background:var(--tinta-rosa);transform:rotate(var(--rot));transition:transform 420ms var(--mola)}
.tab-ck:active{--rot:4deg}
.tab-ck.on{--p:1}
.tab-ck small{display:block;font:500 9.5px/1 var(--font-mono);letter-spacing:.08em;margin-top:4px;opacity:.9}
/* ícones da tab bar (versão B, com tinta — escolhida em 08/11) */
.tab{height:48px;display:flex;align-items:center;justify-content:center}
.tab .ic{width:30px;height:30px;overflow:visible}
.tab-ck{display:flex;align-items:center;justify-content:center}
.tab-ck .ic{width:40px;height:40px;overflow:visible}

/* noite ativa: comanda fixa acima da tab bar */
.nightbar{position:absolute;z-index:39;left:14px;right:14px;bottom:calc(var(--bot) + 80px);min-height:62px;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 14px;color:#020202;text-align:left;
  isolation:isolate;transform:rotate(-.6deg);transition:transform .45s var(--mola),opacity .3s}
.nightbar::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:16px;background:var(--tinta-laranja);filter:url(#aspero-lg)}
.nightbar::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:16px;pointer-events:none;
  background:radial-gradient(rgba(2,2,2,.22) 1.2px,transparent 1.6px) 0 0/7px 7px;-webkit-mask-image:linear-gradient(100deg,transparent 55%,#000);mask-image:linear-gradient(100deg,transparent 55%,#000)}
.nightbar.hide{transform:translateY(240%) rotate(-.6deg);opacity:0;pointer-events:none}
.nightbar .nb-dot{width:10px;height:10px;border-radius:50%;background:#020202;flex:none;animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(.55);opacity:.5}}
.nightbar b{display:block;font:800 17px/20px var(--font-xl);letter-spacing:-.01em}
.nightbar span{font:500 11px/14px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.nightbar .nb-go{margin-left:auto;font:600 13px/1 var(--font-body);padding:9px 12px;border-radius:999px;background:rgba(2,2,2,.12)}

/* ---------- cartaz do evento (duas tintas) ---------- */
.poster{position:relative;isolation:isolate;height:var(--h,168px);color:#020202;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.poster::before{content:"";position:absolute;inset:0;z-index:-3;border-radius:20px;background:var(--i1);filter:url(#aspero-lg)}
.poster .pb{position:absolute;z-index:-2;mix-blend-mode:multiply;opacity:var(--tinta-opacidade);overflow:visible}
.poster .ht{position:absolute;z-index:-1;inset:0;border-radius:20px;background:radial-gradient(rgba(2,2,2,.22) 1.4px,transparent 1.8px) 0 0/8px 8px;
  -webkit-mask-image:radial-gradient(circle at 10% 100%,#000,transparent 60%);mask-image:radial-gradient(circle at 10% 100%,#000,transparent 60%)}
.poster .p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font:500 11.5px/16px var(--font-mono);letter-spacing:.07em;text-transform:uppercase}
.poster .p-t{font:800 32px/31px var(--font-xl);letter-spacing:-.03em;max-width:85%}
.poster .p-t.l{font-size:42px;line-height:40px}
.poster.nopromo::before{background:var(--sunken)}
.poster.nopromo{color:var(--ink)}

.ecard{display:block;width:100%;text-align:left}
.ecard + .ecard{margin-top:22px}
.ecard .e-body{padding:12px 4px 0}
.ecard .e-meta{color:var(--ink-muted);font-size:14px}
.ecard .row-gap{margin-top:10px}
.ecard:active .poster{transform:scale(.985)}
.ecard .poster{transition:transform .3s var(--mola)}

/* ---------- ingresso / benefício (landing v4) ---------- */
.ticket{--stub:62px;--ink-c:var(--tinta-ciano);position:relative;isolation:isolate;display:grid;grid-template-columns:1fr var(--stub);width:100%;min-height:132px;color:#020202;text-align:left;
  transform:rotate(var(--r,0deg));transition:transform 420ms var(--mola)}
.ticket:active{transform:rotate(0deg) scale(.985)}
.ticket::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:12px;background:var(--ink-c);
  -webkit-mask-image:radial-gradient(circle 10px at calc(100% - var(--stub)) 0,transparent 97%,#000),radial-gradient(circle 10px at calc(100% - var(--stub)) 100%,transparent 97%,#000);
  -webkit-mask-composite:source-in;mask-image:radial-gradient(circle 10px at calc(100% - var(--stub)) 0,transparent 97%,#000),radial-gradient(circle 10px at calc(100% - var(--stub)) 100%,transparent 97%,#000);mask-composite:intersect;
  filter:url(#aspero-lg)}
.ticket::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:12px;pointer-events:none;
  background:radial-gradient(rgba(2,2,2,.2) 1.3px,transparent 1.7px) 0 0/8px 8px;-webkit-mask-image:linear-gradient(135deg,#000,transparent 50%);mask-image:linear-gradient(135deg,#000,transparent 50%)}
.t-ciano{--ink-c:var(--tinta-ciano)}.t-rosa{--ink-c:var(--tinta-rosa)}.t-lima{--ink-c:var(--tinta-lima)}.t-laranja{--ink-c:var(--tinta-laranja)}.t-papel{--ink-c:var(--papel)}
.ticket.locked{--ink-c:var(--sunken);color:var(--ink-muted)}
.ticket.locked .tk-stub{border-left-color:var(--hairline)}
.ticket.locked .tk-bar{opacity:.25;filter:invert(1)}
.tk-main{padding:14px 14px 16px 16px;min-width:0}
.tk-top{display:flex;justify-content:space-between;gap:8px;font:500 11px/14px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.tk-top span:last-child{opacity:.75;text-align:right}
.ticket h3{font:800 22px/23px var(--font-xl);letter-spacing:-.02em;margin-bottom:6px}
.ticket p{font-size:14px;line-height:19px}
.tk-big{font:500 18px/1 var(--font-mono);margin:8px 0 2px;letter-spacing:.02em}
.tk-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-left:2px dashed rgba(2,2,2,.45);margin:12px 0}
.tk-bar{display:block;width:28px;height:70px;background:repeating-linear-gradient(0deg,#020202 0 2px,transparent 2px 4px,#020202 4px 5px,transparent 5px 8px,#020202 8px 11px,transparent 11px 13px,#020202 13px 14px,transparent 14px 17px)}
.tk-code{font:500 10.5px/1 var(--font-mono);letter-spacing:.08em;writing-mode:vertical-rl;transform:rotate(180deg);opacity:.8}
.tk-price{display:inline-block;margin-top:10px;font:500 12px/1 var(--font-mono);letter-spacing:.06em;padding:6px 9px;border-radius:999px;background:rgba(2,2,2,.12)}
.tk-price.falta{background:transparent;border:1.5px dashed currentColor}
.tk-novo{position:absolute;right:calc(var(--stub) - 22px);top:-12px;z-index:2}
.tk-seal{position:absolute;z-index:3;right:72px;top:50%;width:104px;height:104px;margin-top:-52px;pointer-events:none;mix-blend-mode:multiply}
.ticket.locked .tk-seal{mix-blend-mode:normal}
.tickets > * + *{margin-top:16px}

/* ---------- passaporte ---------- */
.book{position:relative;isolation:isolate;color:var(--on-papel);background:var(--papel);border-radius:16px;overflow:hidden;transform:rotate(-.6deg);transform-origin:50% 50%}
.book::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-radial-gradient(circle at 50% 135%,transparent 0 9px,rgba(8,10,160,.065) 9px 10px)}
.book > *{position:relative;z-index:1}
.pp-head{display:flex;justify-content:space-between;font:500 11.5px/16px var(--font-mono);letter-spacing:.1em;color:#695f5a;border-bottom:1.5px solid rgba(2,2,2,.2);padding:16px 18px 10px;margin:0}
.pp-page{padding:16px 16px 14px;perspective:900px}
.pp-flip{transform-origin:0 50%;transition:transform .5s var(--saida),opacity .5s}
.pp-flip.turn-l{animation:virar .55s var(--saida) both}
.pp-flip.turn-r{animation:desvirar .55s var(--saida) both}
@keyframes virar{0%{transform:rotateY(-70deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes desvirar{0%{transform:rotateY(70deg);opacity:0;transform-origin:100% 50%}100%{transform:none;opacity:1}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots.c4{grid-template-columns:repeat(4,1fr)}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center}
.slot.empty::before{content:"";position:absolute;inset:6%;border:1.5px dashed rgba(2,2,2,.22);border-radius:50%}
.slot.empty span{font:500 11px/1 var(--font-mono);letter-spacing:.08em;color:rgba(2,2,2,.38)}
.slot.next::before{border-color:var(--p-rosa);border-width:2px;animation:pulsoSlot 1.4s ease-in-out infinite}
.slot.next span{color:var(--p-rosa)}
@keyframes pulsoSlot{50%{transform:scale(.92);opacity:.55}}
.slot .stampsvg{position:absolute;inset:-4%;width:108%;height:108%}
.stampsvg{mix-blend-mode:multiply;overflow:visible;display:block}
.stampsvg text{font-family:var(--font-mono);font-weight:500;fill:currentColor;text-anchor:middle}
.pp-foot{padding:4px 18px 14px;font-size:14px;line-height:19px}
.pp-mrz{font:500 11px/1.5 var(--font-mono);letter-spacing:.16em;color:rgba(2,2,2,.55);padding:10px 18px 14px;background:rgba(2,2,2,.05);overflow:hidden;white-space:nowrap}
.pp-lock{position:absolute;inset:0;display:grid;place-items:center;z-index:3;text-align:center;padding:20px}
.pp-lock b{display:block;font:800 22px/24px var(--font-xl);letter-spacing:-.02em}
.pp-dim .slots{opacity:.35}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pager .mono{font-size:11px;color:var(--ink-muted)}

/* régua de níveis */
.regua{position:relative;padding:4px 0 0}
.regua .trilho{position:absolute;left:14px;right:14px;top:18px;height:4px;border-radius:2px;background:var(--sunken)}
.regua .fill{position:absolute;left:14px;top:18px;height:4px;border-radius:2px;background:var(--tinta-lima);filter:url(#aspero)}
.regua ol{position:relative;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.regua li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.regua .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:500 13px/1 var(--font-mono);background:var(--sunken);color:var(--ink)}
.regua li.ok .n{background:var(--tinta-lima);color:#020202}
.regua li.cur .n{box-shadow:0 0 0 2px var(--tinta-lima)}
.regua small{font-size:12px;line-height:15px;color:var(--ink-muted)}
.regua li.ok small{color:var(--ink)}
.regua em{font:500 10px/1 var(--font-mono);letter-spacing:.06em;font-style:normal;color:var(--tinta-lima)}

.oldbooks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.oldbook{position:relative;aspect-ratio:.72;border-radius:8px 12px 12px 8px;color:#020202;padding:12px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;transform:rotate(var(--r,0deg));transition:transform .42s var(--mola)}
.oldbook:active{transform:rotate(0) scale(.96)}
.oldbook::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--c);filter:url(#aspero-lg)}
.oldbook::after{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:rgba(2,2,2,.25)}
.oldbook b{font:800 18px/19px var(--font-xl);letter-spacing:-.02em;padding-left:6px}
.oldbook span{font:500 10px/13px var(--font-mono);letter-spacing:.06em;padding-left:6px}
.oldbook.wr{--c:var(--sunken);color:var(--ink-muted)}

/* barra de progresso de tinta */
.bar{position:relative;height:10px;border-radius:999px;background:var(--sunken);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--tinta-lima);filter:url(#aspero);transition:width .8s var(--saida)}
.dots{display:flex;gap:8px}
.dots i{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--border-control)}
.dots i.on{border:0;background:var(--tinta-rosa);filter:url(#aspero)}

/* saldo */
.saldo{display:flex;align-items:flex-end;gap:10px}
.saldo .num{font:800 72px/62px var(--font-xl);letter-spacing:-.04em}
.saldo .lbl{font:500 12px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding-bottom:6px}
.ganhos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.ganhos div{padding:9px 6px;border-radius:12px;background:var(--sunken);text-align:center}
.ganhos b{display:block;font:500 15px/1 var(--font-mono);color:var(--tinta-lima)}
.ganhos span{font-size:11px;line-height:14px;color:var(--ink-muted)}

/* listas */
.list{border-radius:20px;background:var(--raised);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;text-align:left;font-size:16px}
.li + .li{border-top:1px solid var(--hairline)}
.li:active{background:var(--sunken)}
.li .go{margin-left:auto;font:500 12px/1 var(--font-mono);letter-spacing:.06em;color:var(--ink-muted)}
.li .sub{display:block;font-size:13px;line-height:17px;color:var(--ink-muted)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid rgba(2,2,2,.14);font-size:15px}
.kv:first-child{border-top:0}
.kv span:first-child{color:#695f5a}
.kv.dark{border-top-color:var(--hairline)}
.kv.dark span:first-child{color:var(--ink-muted)}
.kv.total{font-weight:700;font-size:17px}

/* stats do evento */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:12px 12px 14px;border-radius:16px;background:var(--raised)}
.stat .mono{display:block;font-size:10px;line-height:13px;color:var(--ink-muted);margin-bottom:6px}
.stat b{font:700 18px/22px var(--font-display)}
.lota{display:flex;gap:3px;margin-top:8px}
.lota i{flex:1;height:5px;border-radius:2px;background:var(--sunken)}
.lota i.on{background:var(--tinta-laranja)}

/* quem vai */
.faces{display:flex;align-items:center}
.faces svg{width:44px;height:44px;margin-right:-10px;overflow:visible}
.faces .mais{margin-left:18px;font:500 12px/1 var(--font-mono);letter-spacing:.06em;color:var(--ink-muted)}

/* reviews */
.rev{padding:16px 0;border-top:1px solid var(--hairline)}
.rev:first-child{border-top:0;padding-top:4px}
.rev .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rev .rh svg{width:30px;height:30px;flex:none;overflow:visible}
.rev .rh b{font-weight:600}
.rev .rh .mono{font-size:11px;color:var(--ink-muted);margin-left:auto}
.rev p{color:var(--ink)}
.rev.mine{margin:0 -12px;padding:14px 12px;border-radius:16px;background:color-mix(in srgb,var(--tinta-lima) 12%,var(--raised))}
.ajudou{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--border-control);font:500 13px/1 var(--font-body);color:var(--ink);transition:transform .42s var(--mola)}
.ajudou b{font:500 12px/1 var(--font-mono)}
.ajudou[aria-pressed="true"]{background:var(--tinta-lima);border-color:var(--tinta-lima);color:#020202;transform:rotate(-2deg)}
.ajudou:active{transform:scale(.94)}

/* barra de ação fixa no rodapé */
.view.flush{padding-bottom:0}
.actionbar{position:sticky;z-index:38;bottom:0;margin:0 -16px;padding:22px 16px calc(var(--bot) + 10px);display:flex;gap:10px;
  background:linear-gradient(transparent,var(--surface) 30%)}
.actionbar .btn{flex:1}
.actionbar .btn.ghost{flex:0 0 auto}

/* mapa */
.map{position:relative;border-radius:24px;overflow:hidden;background:var(--raised);height:440px}
.map svg{width:100%;height:100%;display:block}
.map .pin{cursor:pointer}
.map text{font-family:var(--font-mono);font-weight:500;text-anchor:middle}
.map .bairro{font-size:9.5px;letter-spacing:1.4px;fill:var(--ink-muted);opacity:.7}
.map .plbl{font-size:10.5px;letter-spacing:.4px;fill:var(--ink);paint-order:stroke;stroke:var(--raised);stroke-width:5px;stroke-linejoin:round}
.map .plbl.nop{fill:var(--ink-muted)}
.map .vc{animation:pulsoMapa 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulsoMapa{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px}

/* sheet */
#sheet{position:absolute;inset:0;z-index:80;pointer-events:none}
#sheet .scrim{position:absolute;inset:0;background:rgba(2,2,2,.6);opacity:0;transition:opacity .3s}
/* volta com 99 · marca do parceiro (amarelo aproximado, logo provisório) */
.m99{--a99:#ffdd00;--k99:#1a1a1a}
.m99 .h99{display:flex;align-items:center;gap:12px}
.m99 .logo99{width:48px;height:48px;border-radius:12px;background:var(--a99);color:var(--k99);display:grid;place-items:center;font:900 22px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.06em;flex:none}
.m99 .h99 small{display:block;font:500 11px/14px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.m99 .h99 b{display:block;font:700 20px/24px -apple-system,system-ui,sans-serif;letter-spacing:-.01em}
.m99 .r99{margin-top:16px;border-radius:16px;background:#fff;color:var(--k99);padding:4px 16px;font-family:-apple-system,system-ui,sans-serif}
.m99 .r99 .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid rgba(0,0,0,.08);font-size:15px}
.m99 .r99 .kv:first-child{border-top:0}
.m99 .r99 .kv span:first-child{color:#6b6b6b}
.m99 .r99 .kv.off span:last-child{font-weight:700}
.m99 .off99{display:inline-block;background:var(--a99);color:var(--k99);border-radius:6px;padding:2px 7px;font-weight:700;font-size:13px;margin-left:6px}
.m99 .b99{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;border-radius:14px;background:var(--a99);color:var(--k99);font:700 17px/1 -apple-system,system-ui,sans-serif;transition:transform .2s}
.m99 .b99:active{transform:scale(.98)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;padding:10px 20px calc(var(--bot) + 18px);background:var(--raised);border-radius:28px 28px 0 0;
  transform:translateY(105%);transition:transform .46s var(--saida)}
#sheet .panel::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--sunken);margin:0 auto 18px}
#sheet.open{pointer-events:auto}
#sheet.open .scrim{opacity:1}
#sheet.open .panel{transform:none}
#sheet.alert .panel{left:50%;right:auto;bottom:50%;width:276px;margin-left:-138px;border-radius:16px;padding:0;text-align:center;
  background:color-mix(in srgb,#2c2833 92%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);transform:translateY(50%) scale(1.12);opacity:0;transition:transform .3s var(--saida),opacity .2s}
#sheet.alert .panel::before{display:none}
#sheet.alert.open .panel{transform:translateY(50%);opacity:1}
.ios-a{padding:20px 16px 16px}
.ios-a b{display:block;font:600 17px/22px var(--font-body);margin-bottom:4px}
.ios-a p{font-size:13px;line-height:17px}
.ios-b{display:block;width:100%;padding:12px;border-top:.5px solid rgba(255,255,255,.18);color:#0a84ff;font-size:17px;line-height:22px}
.ios-b.strong{font-weight:600}
.ios-map{height:120px;margin:12px 16px 4px;border-radius:10px;overflow:hidden;background:#3a3440}
.sh-t{font:800 26px/28px var(--font-xl);letter-spacing:-.02em;margin-bottom:8px}

/* toast = carimbo de pontos */
#toast{position:absolute;z-index:90;left:50%;top:calc(var(--top) + 10px);transform:translateX(-50%);pointer-events:none}
.toast{--r:-3deg;position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;padding:10px 16px;color:#020202;font:600 14px/18px var(--font-body);white-space:nowrap;
  animation:bater .5s cubic-bezier(.3,.9,.4,1) both}
.toast::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:12px;background:var(--papel);filter:url(#aspero)}
.toast b{font:500 13px/1 var(--font-mono);letter-spacing:.06em;color:var(--p-rosa);border:2px solid currentColor;border-radius:6px;padding:5px 7px}
.toast.out{animation:sumir .35s ease forwards}
@keyframes sumir{to{opacity:0;transform:translateY(-14px) rotate(-3deg)}}

/* tela de bloqueio (notificação do dia seguinte) */
#lock{position:absolute;inset:0;z-index:85;display:none;flex-direction:column;align-items:center;padding:calc(var(--top) + 40px) 12px 0;background:#0c0a10;overflow:hidden;isolation:isolate}
#lock.open{display:flex;animation:inFade .6s ease both}
#lock .wall{position:absolute;inset:-20%;z-index:-1;filter:blur(30px);opacity:.75}
#lock .ld{font:600 19px/24px var(--font-display);opacity:.85}
#lock .lt{font:700 92px/96px var(--font-display);letter-spacing:-.02em;margin-bottom:36px}
.notif{display:flex;gap:12px;width:100%;padding:14px;border-radius:24px;text-align:left;background:color-mix(in srgb,#3a3440 62%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  animation:notifIn .6s var(--mola) .9s both}
@keyframes notifIn{from{transform:translateY(-30px) scale(.94);opacity:0}}
.notif svg{width:42px;height:42px;flex:none;overflow:visible}
.notif .nh{display:flex;justify-content:space-between;font:600 13px/17px var(--font-body);opacity:.75;margin-bottom:2px}
.notif b{display:block;font:600 15px/20px var(--font-body)}
.notif p{font-size:15px;line-height:20px}
#lock .lhint{position:absolute;bottom:calc(var(--bot) + 30px);font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.55}

/* check-in: confirmando local */
.radar{position:relative;width:240px;height:240px;margin:40px auto 0}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--tinta-rosa);animation:radar 2.2s ease-out infinite;opacity:0}
.radar i:nth-child(2){animation-delay:.7s;border-color:var(--tinta-ciano)}
.radar i:nth-child(3){animation-delay:1.4s;border-color:var(--tinta-lima)}
@keyframes radar{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.1);opacity:0}}
.radar .core{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px}

/* carimbar */
.stampstage{position:relative;margin-top:24px}
.stampstage .book{transform:rotate(-1deg)}
.stampstage.thud .book{animation:baque .4s var(--saida)}
@keyframes baque{0%{transform:rotate(-1deg) scale(1)}30%{transform:rotate(-1deg) scale(.975,.96)}100%{transform:rotate(-1deg) scale(1)}}
.respingo{position:absolute;pointer-events:none;mix-blend-mode:multiply;overflow:visible;animation:respingo .5s var(--saida) both}
@keyframes respingo{0%{transform:scale(0) translate(0,0);opacity:0}40%{opacity:.95}100%{transform:scale(1) translate(var(--dx),var(--dy));opacity:.85}}
.slot .bate-in{animation:bater .46s cubic-bezier(.3,.9,.4,1) both}
.slot .vazar{animation:vazar .9s ease-out .15s both}
@keyframes vazar{from{filter:blur(1.4px);opacity:.75}to{filter:none;opacity:1}}
.holdbtn{position:relative;overflow:visible}
.holdbtn .carga{position:absolute;inset:0;border-radius:999px;z-index:-1;pointer-events:none;overflow:hidden}
.holdbtn .carga i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(2,2,2,.32)}
.holdbtn.holding .carga i{width:100%;transition:width .7s linear}
.holdbtn.holding{transform:scale(.97);transition:transform .2s}
.flutua{position:absolute;z-index:4;pointer-events:none;transition:transform .7s var(--saida),opacity .3s}

/* avatar */
.avatar{overflow:visible;display:block}
.av-bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(1.5deg)}}
.avpick{display:flex;gap:12px;justify-content:center}
.avpick button{width:52px;height:52px;border-radius:50%;position:relative;isolation:isolate}
.avpick button::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);filter:url(#aspero)}
.avpick button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}

/* formulários */
.field{display:block;width:100%;min-height:54px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border-control);background:var(--sunken);color:var(--ink);outline:none}
.field:focus{border-color:var(--focus)}
textarea.field{min-height:130px;resize:none;line-height:22px}
.field.mono{font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.q{margin-top:22px}
.q .mono{font-size:11px;color:var(--ink-muted);margin-bottom:10px;display:flex;justify-content:space-between}
.q .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q .opts .chip{padding:14px 10px;font-size:15px;text-align:center}

/* interruptor */
.sw{position:relative;width:51px;height:31px;flex:none;border-radius:999px;background:var(--sunken);transition:background .2s;isolation:isolate}
.sw::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--tinta-lima);filter:url(#aspero);opacity:0;transition:opacity .2s;z-index:-1}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--ink);transition:transform .42s var(--mola)}
.sw[aria-checked="true"]::before{opacity:1}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:#020202}

/* cartão virtual e fidelidade */
.vcard{position:relative;isolation:isolate;aspect-ratio:1.586;border-radius:18px;color:#020202;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:var(--papel);transform:rotate(-1.2deg);transition:transform .7s var(--mola)}
.vcard .pb{position:absolute;z-index:-1;mix-blend-mode:multiply;opacity:var(--tinta-opacidade)}
.vcard .vc-top{display:flex;justify-content:space-between;font:500 11px/14px var(--font-mono);letter-spacing:.1em}
.vcard .vc-n{font:500 20px/1 var(--font-mono);letter-spacing:.14em}
.vcard .vc-brand{font:800 26px/1 var(--font-xl);letter-spacing:-.02em}
.vcard.lift{transform:rotate(0) translateY(-10px) scale(1.02)}
.vcard .pago{position:absolute;right:16px;top:44px;width:140px;color:var(--p-azul)}
.nfc{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px;border-radius:50%;border:2px solid var(--p-azul);opacity:0;pointer-events:none}
.vcard.lift .nfc{animation:radar 1.1s ease-out 2}
.fid{color:#020202}
.fid .fd{display:flex;gap:8px;margin-top:12px}
.fid .fd i{flex:1;aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(2,2,2,.3);position:relative}
.fid .fd i.on{border:0}
.fid .fd i.on svg{position:absolute;inset:-8%;width:116%;height:116%}

/* contatos */
.ct{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;text-align:left}
.ct + .ct{border-top:1px solid var(--hairline)}
.ct svg{width:38px;height:38px;flex:none;overflow:visible}
.ct .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-control);position:relative}
.ct[aria-pressed="true"] .ck{border:0;background:var(--tinta-lima);filter:url(#aspero)}

.hero-stamp::before{content:"";position:absolute;inset:0;border:3px double currentColor;border-radius:6px;filter:url(#aspero)}

.rt .rb:hover,.rt .rb:active{background:var(--raised)}
.rt .rb i{font:500 11px/1 var(--font-mono);font-style:normal;color:var(--ink-muted);width:22px;flex:none}
.rt .foot{margin-top:16px;font-size:12px;line-height:16px;color:var(--ink-muted)}

.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}

function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function r1(n){ return Math.round(n*10)/10; }
function closed(p){
  var n=p.length, d="M"+r1(p[0][0])+" "+r1(p[0][1]);
  for(var i=0;i<n;i++){
    var p0=p[(i-1+n)%n], p1=p[i], p2=p[(i+1)%n], p3=p[(i+2)%n];
    d+="C"+r1(p1[0]+(p2[0]-p0[0])/6)+" "+r1(p1[1]+(p2[1]-p0[1])/6)+" "+r1(p2[0]-(p3[0]-p1[0])/6)+" "+r1(p2[1]-(p3[1]-p1[1])/6)+" "+r1(p2[0])+" "+r1(p2[1]);
  }
  return d+"Z";
}
function blob(seed){
  var R=rng(seed), N=9, ry=.7+R()*.3, pts=[];

  return closed(pts);
}

function nivelInfo(total){
  var acc=0;
  for(var i=0;i<NIV.length;i++){
    if(total < acc+NIV[i].n) return {pag:i, ini:acc, n:NIV[i].n, feitos:total-acc, falta:acc+NIV[i].n-total, nivel:NIV[i]};
    acc+=NIV[i].n;
  }
  var L=NIV.length-1; return {pag:L, ini:acc-NIV[L].n, n:NIV[L].n, feitos:NIV[L].n, falta:0, nivel:NIV[L]};
}

function reguaHTML(total){

/* =====================================================================
   ROTEADOR
   ===================================================================== */
var stack=[], cur=null, viewsEl=document.getElementById("views");
function parse(route){ var i=route.indexOf("/"); return i<0?[route,null]:[route.slice(0,i),route.slice(i+1)]; }
function build(route){
  var p=parse(route), fn=R[p[0]]||R.explorar, out=fn(p[1]);
  var el=document.createElement("section"); el.className="view "+(out.cls||""); el.innerHTML=out.html; el.dataset.route=route;
  return {el:el, out:out};
}
function show(route, anim){
  var b=build(route), old=viewsEl.querySelector(".view:not(.leaving)");
  viewsEl.appendChild(b.el);
  if(b.out.after) b.out.after(b.el);
  if(old && anim!=="none"){
    var inC={push:"in-push",pop:"in-pop",fade:"in-fade",up:"in-up",down:"in-fade"}[anim]||"in-fade";
    var outC={push:"out-push",pop:"out-pop",fade:"out-fade",up:"out-fade",down:"out-down"}[anim]||"out-fade";
    b.el.classList.add(inC); old.classList.add(outC,"leaving");
    setTimeout(function(){ old.remove(); b.el.classList.remove(inC); }, 460);
  } else if(old){ old.remove(); }
  cur=route; curOut=b.out;
  try{ history.replaceState(null,"","#"+route); }catch(e){}
  updateChrome();
}
var curOut={};
function go(route, o){
  o=o||{};
  if(o.replace){ show(route, o.anim||"fade"); return; }
  if(cur) stack.push(cur);
  show(route, o.anim||"push");
}
function back(){
  var r=stack.pop();
  if(!r) r="explorar";
  show(r,"pop");
}
function tab(name){
  stack.length=0; S.pageView=null;
  show(name, cur && parse(cur)[0]===name ? "none" : "fade");
}
function rerender(){
  var old=viewsEl.querySelector(".view:not(.leaving)"); if(!old) return;
  var top=old.scrollTop, b=build(cur);
  b.el.querySelectorAll(".st,.bate").forEach(function(n){ n.classList.remove("st","bate"); });
  viewsEl.replaceChild(b.el, old); b.el.scrollTop=top;
  if(b.out.after) b.out.after(b.el);
  curOut=b.out; updateChrome();
}
function updateChrome(){
  var tb=document.getElementById("tabbar"), nb=document.getElementById("nightbar");
  tb.classList.toggle("hide", !!curOut.noTab);
  tb.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", String(t.dataset.tab===curOut.tab)); });
  var showNight = !!S.noite && !curOut.noNight && !curOut.noTab && parse(cur||"")[0]!=="noite";
  nb.classList.toggle("hide", !showNight);
  if(S.noite){
    var n=1+S.carteira.filter(function(c){return !c.usado;}).length;
    nb.innerHTML='<span class="nb-dot"></span><div><span>Noite ativa · desde '+S.noite.desde+'</span><b>'+EV[S.noite.ev].nome+'</b></div><span class="nb-go">'+plural(n,"benefício","benefícios")+'</span>';
  }
  var views=viewsEl.querySelectorAll(".view");
  views.forEach(function(v){ v.classList.toggle("night", showNight && !v.classList.contains("notab")); });
}

        : '<div class="kv off"><span>Estimativa</span><span>R$ 18 a 22</span></div>')+'</div>'+
    (cup? '<p class="small muted mt12">Seu cupom de 10% da loja Carimbo entra automaticamente nesta corrida.</p>'
        : '<p class="small muted mt12">Os motoristas já sabem do movimento por aqui, então a corrida costuma sair rápido. Tem cupom de 10% no 99 na loja de benefícios.</p>')+
    '<button class="b99 mt24" type="button" data-act="abrir99" data-arg="'+(cup?"cupom":"")+'">Pedir no 99</button><button class="btn full ghost mt12" type="button" data-act="closeSheet">Agora não</button></div>');
};
A.abrir99=function(arg){
  closeSheet();
  if(arg==="cupom"){ S.carteira.forEach(function(c){ if(c.id==="b4") c.usado=true; }); toast("Cupom aplicado. No app real, abre o 99 com o destino preenchido"); setTimeout(rerender,300); }
  else toast("No app real, abre o 99 com o destino preenchido");
};
A.pagar=function(){
  var vc=document.getElementById("vcard"), cta=document.getElementById("payCta");
  vc.classList.add("lift"); cta.innerHTML='<button class="btn full big off" type="button">Aproxime do caixa…</button>';
  setTimeout(function(){
    vc.classList.remove("lift"); S.pago=true;
    document.getElementById("pago").innerHTML=selo("PAGO","00H52","azul",-14,"bate");
    cta.innerHTML='<button class="btn full big lc bate" style="--r:0deg" type="button" data-back>Voltar para a noite</button>';
    toast("Pago. Você economizou R$ 6,40");
  }, 1500);
};
A.encerrarNoite=function(){
  openSheet('<div class="sh-t">Encerrar a noite?</div><p class="muted">Os benefícios deste lugar saem da tela. Amanhã a gente pergunta como foi.</p><button class="btn full big mt24" type="button" data-act="dormir">Encerrar e ir dormir</button><button class="btn full ghost mt12" type="button" data-act="closeSheet">Continuar na festa</button>');
};
A.dormir=function(){ closeSheet(); S.noite=null; S.posPend=true; S.perguntasPend=true; S.resp={}; setTimeout(lockScreen, 300); };
function lockScreen(){
  var L=document.getElementById("lock");
  L.innerHTML='<div class="wall">'+blobSVG("rosa",4,"position:absolute;left:10%;top:10%;width:70%","")+blobSVG("ciano",2,"position:absolute;left:30%;top:40%;width:80%;mix-blend-mode:multiply","")+blobSVG("lima",3,"position:absolute;left:-10%;top:60%;width:60%;mix-blend-mode:multiply","")+'</div>'+
    '<div class="ld">sábado, 8 de novembro</div><div class="lt">11:20</div>'+
    '<button class="notif" type="button" data-act="abrirNotif">'+avatar("ressaca")+'<div style="flex:1"><div class="nh"><span>CARIMBO</span><span>agora</span></div><b>Ressaca? A gente também.</b><p>Conta como foi o Baile Tinta Fresca e ganhe até 15 pontos.</p></div></button>'+
    '<div class="lhint">Toque na notificação</div>';
  L.classList.add("open");
  stack.length=0; show("explorar","none");
}
A.abrirNotif=function(){ var L=document.getElementById("lock"); L.classList.remove("open"); go("pos",{anim:"up"}); };
A.publicarReview=function(){
  var ta=document.getElementById("revtxt"), txt=(ta&&ta.value.trim())||"Som impecável e fila rápida antes da meia-noite. O desconto no bar fez diferença.";
  S.minhaReview={ev:"baile", mine:true, data:"08 NOV", txt:txt, aj:0}; S.posPend=false;
  pontos(10,"Review publicada");
  stack.length=0; stack.push("explorar");
  show("evento/baile","fade");
  setTimeout(function(){ var r=document.getElementById("reviews"), v=viewsEl.querySelector(".view:not(.leaving)"); if(r&&v) v.scrollTo({top:r.offsetTop-80, behavior:"smooth"}); }, 500);
};
A.pularReview=function(){ stack.length=0; show("explorar","fade"); };
A.pag=function(d){
  var info=nivelInfo(S.carimbos.length), pg=(S.pageView==null?info.pag:S.pageView)+(+d);
  S.pageView=Math.max(0,Math.min(NIV.length-1,pg)); S.turn=+d>0?"turn-l":"turn-r"; rerender();
};
A.arqPag=function(arg){ var p=arg.split("|"); S.arqPage=Math.max(0,Math.min(1,(S.arqPage||0)+(+p[0]))); S.turn=+p[0]>0?"turn-l":"turn-r"; rerender(); };
A.wrapped=function(){ toast("Wrapped do mês: fica para depois do essencial"); };
A.bloqueado=function(falta){
  openSheet('<div class="sh-t">Faltam '+plural(+falta,"carimbo","carimbos")+'</div><p class="muted">Este benefício abre quando você completar a página do passaporte. Cada festa com check-in é um carimbo.</p>'+
    '<div class="mt16">'+reguaHTML(S.carimbos.length)+'</div><button class="btn full big mt24" type="button" data-act="acharRole">Achar uma festa</button>');
};
A.acharRole=function(){ closeSheet(); tab("explorar"); };
A.resgatar=function(id){
  var t=TROCA.filter(function(x){return x.id===id;})[0];
  openSheet('<div class="sh-t">Trocar '+t.pts+' pontos?</div><p class="muted">'+t.titulo+' · '+t.onde+'. Fica na sua carteira até '+t.validade.replace("até ","")+'.</p>'+
    '<div class="card sunk mt16"><div class="kv dark"><span>Saldo agora</span><span>'+S.pontos+' pontos</span></div><div class="kv dark total"><span>Depois</span><span>'+(S.pontos-t.pts)+' pontos</span></div></div>'+
    '<button class="btn full big mt24" type="button" data-act="confirmaResgate" data-arg="'+id+'">Confirmar troca</button><button class="btn full ghost mt12" type="button" data-act="closeSheet">Cancelar</button>');
};
A.confirmaResgate=function(id){
  var t=TROCA.filter(function(x){return x.id===id;})[0];
  closeSheet(); S.resgatados[id]=true; S.carteira.unshift({id:id, tk:t.tk, kind:t.kind, titulo:t.titulo, onde:t.onde, novo:true});
  pontos(-t.pts,"Resgatado. Já está na sua carteira.");
  setTimeout(function(){ show(cur,"none"); }, 200);
};
A.comoGanhar=function(){
  openSheet('<div class="sh-t">Como ganhar pontos</div><div class="ganhos" style="grid-template-columns:1fr 1fr"><div><b>+5</b><span>3 perguntas rápidas</span></div><div><b>+10</b><span>escrever review</span></div><div><b>+1</b><span>cada “isso ajudou”</span></div><div><b>+'+BONUS_PAGINA+'</b><span>página completa</span></div></div>'+
    '<button class="btn full big mt24" type="button" data-act="avaliarUltima">Avaliar a última festa</button>');
};
A.avaliarUltima=function(){ closeSheet(); S.perguntasPend=true; go("pos",{anim:"up"}); };
A.usar=function(id){
  if(id==="b4"){ S.carteira.forEach(function(c){ if(c.id===id) c.novo=false; });
    if(S.noite){ A.volta99(); return; }
    openSheet('<div class="sh-t">Use na volta</div><p class="muted">Com a noite ativa, toque em “Voltar com 99”. O cupom de 10% entra sozinho na corrida.</p><button class="btn full big mt24" type="button" data-act="closeSheet">Entendi</button>'); return; }
  if(S.noite){ go("cartao"); return; }
  openSheet('<div class="sh-t">Use na festa</div><p class="muted">Quando você fizer check-in, o benefício aparece na noite ativa e é aplicado no cartão virtual.</p><button class="btn full big mt24" type="button" data-act="closeSheet">Entendi</button>');
  S.carteira.forEach(function(c){ if(c.id===id) c.novo=false; });
};
A.avInk=function(arg){ var p=arg.split("|"); S.avatarInk=p[0]; rerender(); };
A.avatarPronto=function(origem){ S.avatarAsked=true; if(origem==="ck"){ go("confirmando",{replace:true,anim:"fade"}); } else back(); };
A.criarLista=function(){
  var v=document.getElementById("lnome"); S.novaLista=(v&&v.value.trim())||"Pré de sexta";
  iosAlert("“Carimbo” quer acessar seus contatos","Para achar seus amigos que já estão no Carimbo. Nada é enviado sem você escolher.",[["Permitir","contatosOk",true],["Não permitir","closeSheet"]]);
};
A.contatosOk=function(){ closeSheet(); go("contatos"); };
A.selCt=function(n){ S.sel[n]=!S.sel[n]; rerender(); };
A.addLista=function(){ var n=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length; S.listas.push({nome:S.novaLista||"Pré de sexta", n:n}); S.sel=null; back(); setTimeout(rerender,470); toast("Lista criada com "+plural(n,"pessoa","pessoas")); };
A.sw=function(k, el){ if(k==="optin") S.optin=!S.optin; else S.pv[k]=!S.pv[k]; el.setAttribute("aria-checked", String(k==="optin"?S.optin:S.pv[k])); };
A.roteiro=function(){ openSheet('<div class="rt">'+roteiroHTML()+'</div>'); };

/* =====================================================================
   ROTEIRO E ESTADOS (painel lateral no computador, sheet no iPhone)
   ===================================================================== */
var J = {
  f0:function(){ novo(); stack.length=0; show("abertura","fade"); },
  f1:function(){ stack.length=0; show("explorar","fade"); },
  f1d:function(){ stack.length=0; stack.push("explorar"); show("evento/baile","push"); },
  f2:function(){ if(S.noite){ S.noite=null; S.checkinHoje=false; if(S.carimbos.length && S.carimbos[S.carimbos.length-1].data==="07 NOV") S.carimbos.pop(); } stack.length=0; show("explorar","none"); A.checkin(); },
  f3:function(){ if(!S.noite){ S.noite={ev:"baile",desde:"23H40"}; S.checkinHoje=true; } stack.length=0; stack.push("explorar"); show("noite","push"); },
  f4:function(){ S.noite=null; lockScreen(); },
  f5:function(){ tab("passaporte"); },
  f6:function(){ tab("beneficios"); },
  f7:function(){ tab("voce"); },
  novo:function(){ novo(); stack.length=0; show("explorar","fade"); toast("Usuário novo: sem conta, sem carimbos"); },
  rec:function(){ recorrente(); stack.length=0; show("explorar","fade"); toast("Usuário recorrente: 2 carimbos, 85 pontos"); },
  gps:function(){ S.gpsErro=true; S.noite=null; S.checkinHoje=false; stack.length=0; show("explorar","none"); A.checkin(); },
  vazio:function(){ S.carimbos=[]; S.pageView=null; tab("passaporte"); },
  virada:function(){ virada(); },
  pobre:function(){ S.pontos=20; S.resgatados={}; tab("beneficios"); toast("Saldo: 20 pontos"); },
  loja:function(){ S.lojaVazia=!S.lojaVazia; tab("beneficios"); },
  pos:function(){ S.noite=null; S.perguntasPend=true; stack.length=0; show("explorar","none"); go("pos",{anim:"up"}); }
};
function virada(){
  tab("passaporte");
  setTimeout(function(){
    var bw=document.getElementById("bookwrap"); if(!bw) return;
    var s=document.createElement("div"); s.style.cssText="position:absolute;left:50%;top:50%;width:170px;margin:-85px 0 0 -85px;z-index:5";
    s.innerHTML=selo("ARQUIVADO",S.mes,"verm",-12,"bate"); bw.style.position="relative"; bw.appendChild(s);
    setTimeout(function(){
      ARQUIVO.nov={mes:S.mes, carimbos:S.carimbos.slice()}; S.arquivo.unshift("nov");
      S.mes="DEZ 2026"; S.carimbos=[]; S.pageView=null; S.turn="turn-l"; rerender(); toast("Passaporte de dezembro, novo em folha");
    }, 1300);
  }, 450);
}
function roteiroHTML(){
  function b(k,n,t){ return '<button class="rb" type="button" data-jump="'+k+'"><i>'+n+'</i><span>'+t+'</span></button>'; }
  return '<h2>Carimbo</h2><p>Protótipo clicável do frequentador. Nada funciona de verdade: o estado é falso e zera quando a página recarrega.</p>'+
    '<h3>Fluxos</h3>'+b("f0","F0","Entrada: abertura e voucher")+b("f1","F1","Descoberta: Explorar")+b("f1d","F1","Detalhe do evento")+b("f2","F2","Check-in e carimbar")+b("f3","F3","Noite ativa e cartão virtual")+
      b("f4","F4","Pós-evento: notificação")+b("f5","F5","Passaporte")+b("f6","F6","Benefícios")+b("f7","F7","Você e conta")+
    '<h3>Estados</h3>'+b("novo","·","Usuário novo (sem conta)")+b("rec","·","Usuário recorrente")+b("gps","·","Check-in: fora do raio")+b("vazio","·","Passaporte vazio")+
      b("virada","·","Virada de mês")+b("pobre","·","Pontos insuficientes")+b("loja","·","Loja vazia (liga/desliga)")+b("pos","·","Perguntas pendentes")+
    '<p class="foot">Provisórios: avatar, logo, valores de pontos e taxa, níveis 8 e 12, eventos e lugares. No iPhone, este painel abre com 3 toques no topo da tela.</p>';
}
document.getElementById("roteiro").innerHTML=roteiroHTML();

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener("click", function(e){
  var j=e.target.closest("[data-jump]");
  if(j){ closeSheet(); document.getElementById("lock").classList.remove("open"); J[j.dataset.jump](); return; }
  var t=e.target.closest("[data-go],[data-tab],[data-back],[data-act]");
  if(!t || t.disabled) return;
  if(t.dataset.go){ if(sheet.classList.contains("open")) closeSheet(); go(t.dataset.go); }
  else if(t.dataset.tab){ if(sheet.classList.contains("open")) closeSheet(); tab(t.dataset.tab); }
  else if(t.hasAttribute("data-back")) back();
  else if(t.dataset.act && A[t.dataset.act]) A[t.dataset.act](t.dataset.arg, t);
});
document.addEventListener("touchstart", function(){}, {passive:true}); /* ativa :active no iOS */

/* 3 toques no topo abrem o roteiro */
var taps=[];
document.getElementById("device").addEventListener("pointerdown", function(e){
  var r=this.getBoundingClientRect();
  if(e.clientY - r.top > 60) return;
  var now=Date.now(); taps=taps.filter(function(t){return now-t<700;}); taps.push(now);
  if(taps.length>=3){ taps=[]; A.roteiro(); }
});

/* relógio da moldura */
(function(){ var c=document.getElementById("clock"); if(c) c.textContent="23:40"; })();

/* início */
var start=(location.hash||"").slice(1);
if(start && R[parse(start)[0]] && ["confirmando","carimbar","progresso"].indexOf(parse(start)[0])<0){ if(start!=="abertura"&&start!=="voucher") stack.push("explorar"); show(start,"none"); }
else { novo(); show("abertura","none"); }

})();
</script>
</body>
</html>
